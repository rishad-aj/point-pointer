      width: r.x + "px",
      height: r.y + "px",
      transform: "translate(" + tx + "px, " + ty + "px) scale(1.2)",
      transformOrigin: (target.x*100) + "% " + (target.y*100) + "%"
    };
  }

  function applyStyle(style){
    for(var k in style){
      blurImg.style[k] = style[k];
      sharpImg.style[k] = style[k];
    }
    blurImg.style.filter = "blur(8px)";
  }

  function tryLoad(index, cb){
    var order = [];
    if(ACTIVE_BASE) order.push(ACTIVE_BASE);
    for(var k=0;k<IMAGE_BASES.length;k++){ if(IMAGE_BASES[k]!==ACTIVE_BASE) order.push(IMAGE_BASES[k]); }
    var attempted = [];
    var step = 0;
    function next(){
      if(step >= order.length){ cb(null, attempted); return; }
      var url = order[step] + index + ".jpg";
      attempted.push(url);
      var im = new Image();
      var done = false;
      var timer = setTimeout(function(){ if(!done){ done=true; step++; next(); } }, 15000);
      im.onload = function(){
        if(done) return;
        done = true; clearTimeout(timer);
        ACTIVE_BASE = order[step];
        cb(im, attempted);
      };
      im.onerror = function(){
        if(done) return;
        done = true; clearTimeout(timer);
        step++; next();
      };
      im.src = url;
    }
    next();
  }

  function diagFailed(idx, attempted){
    mode = "error";
    var msg = "Image " + idx + ".jpg failed to load. Tried: " + attempted.join(", ") + ". " +
      "Fix: put all 711 .jpg files in an images/ folder next to index.html " +
      "(perchance build: src/images/), serve over http (e.g. npx serve .), then reload.";
    loadingTextEl.textContent = msg;
    if(window.console) console.error("[pp-clone] " + msg);
  }

  function showPhoto(pointer){
    lockedPos = {x: pointer.x, y: pointer.y};
    var idx = pickIndex(normPoint(lockedPos));
    var target = {x: POSITIONS[idx][0], y: POSITIONS[idx][1]};
    var req = ++requestId;
    setLoading("finding");
    tryLoad(idx, function(img, attempted){
      if(req !== requestId) return; // pointer moved on; ignore stale load
      if(!img){
        diagFailed(idx, attempted || []);
        return;
      }
      current = {index: idx, target: target, imgW: img.naturalWidth || img.width, imgH: img.naturalHeight || img.height, src: img.src};
      // normalize at render time so a resize during loading still lands under the pointer
      var style = computeStyle(current.imgW, current.imgH, normPoint(lockedPos), target);
      blurImg.src = current.src;
      sharpImg.src = current.src;
      applyStyle(style);
      // brief "Pointer located" beat like the original, then reveal
      setLoading("located");
      clearTimeout(locatedTimer);
      locatedTimer = setTimeout(function(){
        if(req !== requestId) return; // cancelled while waiting
        mode = "shown";
        loadingEl.hidden = true;
        stageEl.hidden = false;
      }, 350);
    });
  }

  function relayout(){
    if(!current || !lockedPos) return;
    // keep the fingertip under the same screen point when the viewport changes
    applyStyle(computeStyle(current.imgW, current.imgH, normPoint(lockedPos), current.target));
  }

  function scheduleFind(){
    clearTimeout(findTimer);
    // "hold still" debounce: wait until pointer stops moving
    findTimer = setTimeout(function(){
      if(rawPos) showPhoto(rawPos);
    }, 900);
  }

  function onPoint(x, y){
    rawPos = {x:x, y:y};
    if(isTouch){
      touchCursor.hidden = false;
      touchCursor.style.transform = "translate(" + (x-3) + "px, " + (y-4) + "px)";
    }
    // if a photo is already showing and pointer barely moved, ignore
    if(current && lockedPos){
      var dx = x - lockedPos.x, dy = y - lockedPos.y;
      if(dx*dx + dy*dy < 144) return; // <12px: stay
    }
    // pointer moved: cancel any pending reveal/load so a stale photo can't pop in
    clearTimeout(locatedTimer);
    requestId++;
    if(!stageEl.hidden || current){
      current = null;
      setLoading("finding");
    } else if(mode !== "finding"){
      setLoading("finding");
    }
    scheduleFind();
  }

  window.addEventListener("mousemove", function(e){
    if(isTouch) return; // touch devices also emit synthetic mouse events
    onPoint(e.clientX, e.clientY);
  }, {passive:true});
  window.addEventListener("touchstart", function(e){
    if(e.touches && e.touches[0]) onPoint(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener("touchmove", function(e){
    if(e.touches && e.touches[0]) onPoint(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  document.addEventListener("mouseleave", function(){
    clearTimeout(findTimer);
    clearTimeout(locatedTimer);
    requestId++;
    rawPos = null; lockedPos = null; current = null;
    touchCursor.hidden = true;
    setLoading("idle");
  });
  document.addEventListener("mouseenter", function(){ /* wait for next move */ });
  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", function(){ setTimeout(relayout, 100); });

  // Probe for the images folder at boot so a missing folder shows a clear
  // fix-it message instead of a cryptic failure after the first mouse move.
  setLoading("idle");
  (function detectBase(){
    var step = 0;
    function next(){
      if(step >= IMAGE_BASES.length){
        loadingTextEl.textContent = "Couldn't find images/0.jpg in any of: " + IMAGE_BASES.join(", ") + ". " +
          "Fix: put all 711 .jpg files in an images/ folder next to index.html, serve over http (e.g. npx serve .), then reload.";
        return;
      }
      var url = IMAGE_BASES[step] + "0.jpg";
      var im = new Image();
      var done = false;
      var timer = setTimeout(function(){ if(!done){ done=true; step++; next(); } }, 8000);
      im.onload = function(){ if(!done){ done=true; clearTimeout(timer); ACTIVE_BASE = IMAGE_BASES[step]; } };
      im.onerror = function(){ if(!done){ done=true; clearTimeout(timer); step++; next(); } };
      im.src = url;
    }
    next();
  })();
  // expose for debugging / export testing
  window.ppClone = {
    pickIndex: pickIndex,          // pickIndex(normalizedPoint) -> photo index
    computeStyle: computeStyle,    // computeStyle(imgW, imgH, normalizedPoint, target)
    get current(){ return current; },
    get mode(){ return mode; }
  };
})();
</script>

</body>
</html>
